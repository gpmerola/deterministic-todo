name: Publish Web Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Scrivi PUBBLICA per confermare la pubblicazione Web'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-web
  cancel-in-progress: true

jobs:
  build:
    if: inputs.confirmation == 'PUBBLICA'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Verify and build Web
        run: |
          flutter pub get
          dart run build_runner build
          git diff --exit-code
          flutter analyze
          flutter test
          flutter build web --release --no-pub --no-wasm-dry-run \
            --base-href /deterministic-todo/ \
            --dart-define-from-file=supabase/config.json
          python3 - <<'PY'
          import json
          import os, re
          from pathlib import Path
          version, build = re.match(r'^version:\s*([^+\s]+)\+(\d+)\s*$', Path('pubspec.yaml').read_text(), re.M).groups()
          Path('build/web/release-info.json').write_text(json.dumps({
              'schema_version': 1,
              'version': version,
              'build': int(build),
              'source_commit': os.environ['GITHUB_SHA'],
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    if: inputs.confirmation == 'PUBBLICA'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Web to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verify deployed identity
        run: |
          curl --fail --location --retry 12 --retry-delay 5 \
            -H 'Cache-Control: no-cache' \
            "https://gpmerola.github.io/deterministic-todo/release-info.json?commit=$GITHUB_SHA" \
            --output web-release-info.json
          python3 - <<'PY'
          import json
          import os
          data = json.load(open('web-release-info.json', encoding='utf-8'))
          assert data['version'] == '2.40.2'
          assert data['build'] == 180
          assert data['source_commit'] == os.environ['GITHUB_SHA']
          PY
