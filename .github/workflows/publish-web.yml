name: Publish Web App

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/config.json'
      - 'tools/generate_release_manifest.py'
      - '.github/workflows/publish-web.yml'
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Verify and build
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release \
            --base-href /deterministic-todo/ \
            --dart-define-from-file=supabase/config.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
