name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # connectivity_plus 7.3 usa Network.framework del macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build unsigned macOS app
        run: >-
          flutter build macos --release
          --dart-define-from-file=supabase/config.json

      - name: Package app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" DeterministicTodo-macOS.zip

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DeterministicTodo-macOS
          path: DeterministicTodo-macOS.zip
          retention-days: 30
          if-no-files-found: error
