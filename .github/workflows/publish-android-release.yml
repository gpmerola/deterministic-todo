name: Publish Android and Web Release

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'android/**'
      - 'assets/**'
      - 'lib/**'
      - 'web/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/config.json'
      - 'tools/generate_release_manifest.py'
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Scrivi PUBBLICA per confermare la release coordinata'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-coordinated-release
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push' || inputs.confirmation == 'PUBBLICA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate unpublished version
        id: version
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version: //p' pubspec.yaml)
          VERSION=${PACKAGE_VERSION%%+*}
          BUILD=${PACKAGE_VERSION##*+}
          test -n "$VERSION"
          test "$BUILD" -gt 0
          if curl --silent --fail --location \
            "https://api.github.com/repos/gpmerola/deterministic-todo-releases/releases/tags/v$VERSION" \
            >/dev/null; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Verify once for both platforms
        run: |
          flutter pub get
          dart run build_runner build
          git diff --exit-code
          python3 -m unittest tools/test_generate_release_manifest.py
          flutter analyze
          flutter test

  build-web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Build web client
        run: |
          flutter pub get
          flutter build web --release --no-pub --no-wasm-dry-run \
            --base-href /deterministic-todo/ \
            --dart-define-from-file=supabase/config.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('build/web/release-info.json').write_text(json.dumps({
              'schema_version': 1,
              'version': os.environ['VERSION'],
              'build': int(os.environ['BUILD']),
              'source_commit': os.environ['GITHUB_SHA'],
          }, indent=2) + '\n', encoding='utf-8')
          PY
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD: ${{ needs.verify.outputs.build }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web client
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Prepare stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      - name: Build signed APKs per CPU
        run: |
          flutter pub get
          flutter build appbundle --release --flavor play \
            --split-debug-info=build/private-symbols/play \
            --dart-define=DISTRIBUTION_CHANNEL=play \
            --dart-define-from-file=supabase/config.json
          flutter build apk --release --flavor direct \
            --split-debug-info=build/private-symbols/universal \
            --dart-define=DISTRIBUTION_CHANNEL=direct \
            --dart-define-from-file=supabase/config.json
          flutter build apk --release --flavor direct --split-per-abi \
            --split-debug-info=build/private-symbols \
            --dart-define=DISTRIBUTION_CHANNEL=direct \
            --dart-define-from-file=supabase/config.json
        env:
          ANDROID_KEYSTORE_PATH: release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: deterministic-todo
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Preserve private Dart symbols
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ needs.verify.outputs.version }}
          path: build/private-symbols/
          retention-days: 30
          if-no-files-found: error

      - name: Prepare Android release assets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD: ${{ needs.verify.outputs.build }}
        run: |
          mkdir release-assets
          cp build/app/outputs/bundle/playRelease/app-play-release.aab release-assets/DeterministicTodo-Android.aab
          cp build/app/outputs/flutter-apk/app-direct-release.apk release-assets/DeterministicTodo-Android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-direct-release.apk release-assets/DeterministicTodo-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-direct-release.apk release-assets/DeterministicTodo-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-direct-release.apk release-assets/DeterministicTodo-Android-x86_64.apk
          python3 tools/generate_release_manifest.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --source-commit "$GITHUB_SHA" \
            --release-base-url "https://github.com/gpmerola/deterministic-todo-releases/releases/download/v$VERSION" \
            --universal release-assets/DeterministicTodo-Android-universal.apk \
            --arm64 release-assets/DeterministicTodo-Android-arm64-v8a.apk \
            --arm32 release-assets/DeterministicTodo-Android-armeabi-v7a.apk \
            --x86-64 release-assets/DeterministicTodo-Android-x86_64.apk \
            --output release-assets/manifest.json

      - name: Upload staged Android release
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ needs.verify.outputs.version }}
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  deploy-web:
    needs: [verify, build-web, build-android]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy coordinated web release
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages enforces a hard maximum of ten minutes.
          timeout: 600000

      - name: Verify deployed web identity
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD: ${{ needs.verify.outputs.build }}
        run: |
          curl --fail --location --retry 12 --retry-delay 5 \
            -H 'Cache-Control: no-cache' \
            "https://gpmerola.github.io/deterministic-todo/release-info.json?commit=$GITHUB_SHA" \
            --output web-release-info.json
          python3 - <<'PY'
          import json
          import os

          data = json.load(open('web-release-info.json', encoding='utf-8'))
          assert data['version'] == os.environ['VERSION']
          assert data['build'] == int(os.environ['BUILD'])
          assert data['source_commit'] == os.environ['GITHUB_SHA']
          PY

  publish-android:
    needs: [verify, build-android, deploy-web]
    runs-on: ubuntu-latest
    environment: android-release
    env:
      GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
      RELEASE_REPOSITORY: gpmerola/deterministic-todo-releases
    steps:
      - name: Require dedicated release token
        run: test -n "$GH_TOKEN"

      - name: Download staged Android release
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ needs.verify.outputs.version }}
          path: release-assets

      - name: Publish Android only after web succeeds
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "v$VERSION" release-assets/* \
            --repo "$RELEASE_REPOSITORY" \
            --title "Deterministic Todo $VERSION" \
            --notes "Release Android e web coordinate e verificate dallo stesso commit." \
            --latest

      - name: Verify public Android manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://github.com/$RELEASE_REPOSITORY/releases/download/v$VERSION/manifest.json" \
            --output published-manifest.json
          cmp release-assets/manifest.json published-manifest.json

  verify-release-parity:
    needs: [verify, deploy-web, publish-android]
    runs-on: ubuntu-latest
    steps:
      - name: Compare public Android and web identities
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          BUILD: ${{ needs.verify.outputs.build }}
        run: |
          curl --fail --location --retry 8 --retry-delay 4 \
            -H 'Cache-Control: no-cache' \
            "https://gpmerola.github.io/deterministic-todo/release-info.json?commit=$GITHUB_SHA" \
            --output web.json
          curl --fail --location --retry 8 --retry-delay 4 \
            "https://github.com/gpmerola/deterministic-todo-releases/releases/download/v$VERSION/manifest.json" \
            --output android.json
          python3 - <<'PY'
          import json
          import os

          web = json.load(open('web.json', encoding='utf-8'))
          android = json.load(open('android.json', encoding='utf-8'))
          expected = (os.environ['VERSION'], int(os.environ['BUILD']), os.environ['GITHUB_SHA'])
          assert (web['version'], web['build'], web['source_commit']) == expected
          assert (android['version'], android['build'], android['source_commit']) == expected
          expected_path = f"/releases/download/v{os.environ['VERSION']}/"
          assert set(android['platforms']) == {
              'android', 'android-arm64-v8a', 'android-armeabi-v7a', 'android-x86_64'
          }
          for platform in android['platforms'].values():
              assert expected_path in platform['url']
              assert len(platform['sha256']) == 64
          PY
