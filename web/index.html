<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Attività deterministiche, offline-first e sincronizzate sui tuoi dispositivi.">
  <meta name="theme-color" content="#DB4035">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Deterministic Todo">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon-v3.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="shortcut icon" href="favicon-32.png">

  <title>Deterministic Todo</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="sqlite3.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="drift_worker.js" as="script">
  <style>
    html, body { margin: 0; min-height: 100%; background: #1f1f1f; }
    #app-loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #f5f5f5; font: 500 16px system-ui, sans-serif;
    }
    #app-loading::before {
      content: ""; width: 36px; height: 36px; margin: 0 auto 14px;
      display: block; border-radius: 10px; background: #db4035;
    }
    body:has(flutter-view) #app-loading { display: none; }
    @media (prefers-color-scheme: light) {
      html, body { background: #fafafa; }
      #app-loading { color: #292929; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">Apro le attività…</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
